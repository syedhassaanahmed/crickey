# crickey's golden questions (plan › Goal): the one place they're listed. Docs, tests and issues
# refer to them by number, so changing one means editing only this file.
#
# Each case has:
# - number and golden_question: the golden question, in its general form.
# - held_out: true for a held-out case, which asks the same kind of question as golden
#   question `number` in other words, about other players, teams, formats or periods. Nothing in
#   crickey quotes it, so it shows how models handle a question they haven't been shown; the eval
#   reports held-out cases apart. A held-out case takes golden_question from its golden case.
# - question: what the eval asks. Real players are filled in, and the answer can't change, because
#   the players have retired or the period has ended (fixed_because).
# - tool: the answer tool the question needs.
# - calls: the calls the question needs. A model passes the arguments check when each one matches
#   a call it made: the same tool, and every argument given here. Formats, metrics, periods,
#   filters, splits and numbers of teams compare as crickey resolves them, and players by ID or
#   by one of their names. A period here is what the call's text means, so "2000 to 2009"
#   matches its dates. A career period also matches the span crickey resolves for it, given as
#   start and end.
# - facts: the known answer, confirmed live (R10). The final answer must contain one text from
#   each entry. A count of countries, such as "11 countries", also matches the count before a
#   bracketed list of that many, such as "11 (Australia, …)".

[[case]]
number = 1
golden_question = "Average number of innings taken per ODI century (minimum X number of centuries)."
id = "q1-innings-per-odi-century-2000s"
question = "Average number of innings taken per ODI century (minimum 10 centuries), counting only ODIs from 2000 to 2009."
tool = "leaderboard"
fixed_because = "The period ended in 2009."
facts = [["13.72"], ["Tendulkar"], ["9.86"]]

[[case.calls]]
format = "ODI"
metrics = [["innings_per_hundred"]]
minimum = 10
period = { kind = "dates", start = 2000-01-01, end = 2009-12-31 }

[[case]]
number = 2
golden_question = "Which players have scored Test hundreds more frequently than player X?"
id = "q2-test-hundreds-more-often-than-tendulkar"
question = "Which players have scored Test hundreds more frequently than Sachin Tendulkar, over the span of his career?"
tool = "better_than_player"
fixed_because = "Tendulkar's career span ended in 2013."
facts = [["6.45"], ["Pujara"], ["Sangakkara"], ["Hayden"], ["Amla"], ["Kallis"], ["Azharuddin"]]

[[case.calls]]
player = { id = 35320, names = ["Tendulkar"] }
format = "Test"
metrics = [["innings_per_hundred"]]
period = { kind = "career", start = 1989-11-15, end = 2013-11-14 }

