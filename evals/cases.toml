# Eval cases (#18, D37): the golden questions (plan › Goal) with real players filled in, and
# answers that can't change. Each case's known answer was confirmed live; R10 records it.
#
# calls: the calls the question needs. A model passes the arguments check when each one matches
# a call it made: the same tool, and every argument given here. Formats, metrics, filters and
# splits compare as crickey resolves them, and players by ID or by one of their names.
# facts: the final answer must contain one text from each entry.

[[case]]
id = "q1-innings-per-odi-century-2000s"
golden_question = 1
question = "Average number of innings taken per ODI century (minimum 10 centuries), counting only ODIs from 2000 to 2009."
tool = "leaderboard"
fixed_because = "The period ended in 2009."
facts = [["13.72"], ["Tendulkar"], ["9.86"]]

[[case.calls]]
format = "ODI"
metrics = [["innings_per_hundred"]]
minimum = 10
period = { kind = "dates", start = 2000-01-01, end = 2009-12-31 }

[[case]]
id = "q2-test-hundreds-more-often-than-tendulkar"
golden_question = 2
question = "Which players have scored Test hundreds more frequently than Sachin Tendulkar, over the span of his career?"
tool = "better_than_player"
fixed_because = "Tendulkar's career span ended in 2013."
facts = [["6.45"], ["Pujara"], ["Sangakkara"], ["Hayden"], ["Amla"], ["Kallis"], ["Azharuddin"]]

[[case.calls]]
player = { id = 35320, names = ["Tendulkar"] }
format = "Test"
metrics = [["innings_per_hundred"]]
period = { kind = "career" }

[[case]]
id = "q3-t20i-average-and-strike-rate-beat-mccullum"
